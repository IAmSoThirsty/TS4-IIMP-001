name: Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall reference/python conformance
      - name: Run representative conformance suite
        run: python conformance/test_mpdp_conformance.py
      - name: Validate JSON schemas
        run: python -m json.tool standard/schemas/audit-record.schema.json >/dev/null && python -m json.tool standard/schemas/semantic-finding.schema.json >/dev/null && python -m json.tool standard/schemas/conformance-result.schema.json >/dev/null
