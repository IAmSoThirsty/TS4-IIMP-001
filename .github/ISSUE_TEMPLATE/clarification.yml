name: Clarification request
description: Identify ambiguous wording or conflicting interpretation.
title: "[Clarification]: "
labels: ["clarification"]
body:
  - type: input
    id: version
    attributes:
      label: Standard version
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or control
    validations:
      required: true
  - type: textarea
    id: ambiguity
    attributes:
      label: Ambiguity
      description: Quote the relevant language and explain the competing interpretations.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Implementation or conformance impact
