name: Conformance case proposal
description: Propose a new deterministic evaluation case.
title: "[Conformance]: "
labels: ["conformance"]
body:
  - type: textarea
    id: failure
    attributes:
      label: Failure mode
    validations:
      required: true
  - type: textarea
    id: stimulus
    attributes:
      label: Stimulus and authoritative record
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Required behavior and pass/fail criteria
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Expected audit and state disposition
